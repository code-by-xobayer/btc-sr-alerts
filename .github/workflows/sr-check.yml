name: Check BTC S/R

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sr-check]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # ---- Restore the single state file ----
      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: sr-state.json
          key: sr-state

      # ---- Run the check ----
      - run: npm start
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # ---- Save the state file using the SAME key ----
      - name: Save state cache
        uses: actions/cache@v4
        with:
          path: sr-state.json
          key: sr-state
