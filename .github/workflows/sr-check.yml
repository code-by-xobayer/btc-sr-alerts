name: Check BTC S/R

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sr-check]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # ---- Restore the state file ----
      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: sr-state.json
          key: sr-state

      # ---- DEBUG: show the restored state ----
      - name: Show restored state
        run: |
          echo "=== Restored state ==="
          cat sr-state.json 2>/dev/null || echo "No state file found (first run or cache empty)"

      # ---- Run the check ----
      - run: npm start
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # ---- DEBUG: show the saved state ----
      - name: Show saved state
        run: |
          echo "=== Saved state ==="
          cat sr-state.json 2>/dev/null || echo "No state file created"

      # ---- Save the state file ----
      - name: Save state cache
        uses: actions/cache@v4
        with:
          path: sr-state.json
          key: sr-state
